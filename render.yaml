# Blueprint de Render: crea la base de datos y la app en un solo paso
databases:
  - name: farallones-db
    databaseName: farallones
    user: farallones
    plan: free
    region: oregon

services:
  - type: web
    name: farallones-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: farallones-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Juan Sebastián Trujillo Espinal
      - key: CONTACT_EMAIL
        sync: false
